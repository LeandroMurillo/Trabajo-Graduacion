x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Definir PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Definir ADMIN_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app
    depends_on:
      frontend-postulantes:
        condition: service_healthy
      frontend-admin:
        condition: service_healthy
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  db:
    image: mariadb:lts-noble
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD}
      MARIADB_DATABASE: proyecto
      MARIADB_USER: ${DB_USER:?Definir DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/proyecto_script.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./db/sp admins.sql:/docker-entrypoint-initdb.d/2_sp_admins.sql:ro
      - ./db/sp postulantes.sql:/docker-entrypoint-initdb.d/3_sp_postulantes.sql:ro
      - ./db/sp usuarios.sql:/docker-entrypoint-initdb.d/4_sp_usuarios.sql:ro
      - ./db/sp_superadmin.sql:/docker-entrypoint-initdb.d/5_sp_superadmin.sql:ro
    networks:
      - database
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: proyecto
      DB_USER: ${DB_USER:?Definir DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET}
      APP_ORIGINS: https://${PUBLIC_DOMAIN:?Definir PUBLIC_DOMAIN},https://${ADMIN_DOMAIN:?Definir ADMIN_DOMAIN}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?Definir FIREBASE_SERVICE_ACCOUNT_JSON}
    expose:
      - '3000'
    networks:
      - app
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  frontend-postulantes:
    build:
      context: ./frontend-postulantes
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ''
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Definir VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Definir VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Definir VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Definir VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGE_SENDER_ID: ${VITE_FIREBASE_MESSAGE_SENDER_ID:?Definir VITE_FIREBASE_MESSAGE_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Definir VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  frontend-admin:
    build:
      context: ./frontend-administradores
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ''
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  app:
  database:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  mariadb-data:
